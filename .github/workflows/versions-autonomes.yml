# Fabrique les versions autonomes d'Onde2Vid (sans Python, avec FFmpeg inclus)
# pour Windows, Linux et macOS (Intel et Apple Silicon).
#
# - À chaque étiquette « v… » (ex. git tag v1.0.0 && git push --tags) :
#   les fichiers sont publiés dans une nouvelle « Release » GitHub.
# - Bouton « Run workflow » (onglet Actions) : fabrication de test,
#   fichiers téléchargeables dans le résumé de l'exécution.

name: Versions autonomes

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows,            icon: assets/icon.ico,  sep: ";" }
          - { os: ubuntu-22.04,   name: Linux,              icon: "",               sep: ":" }
          - { os: macos-15-intel, name: macOS-Intel,        icon: assets/icon.icns, sep: ":" }
          - { os: macos-14,       name: macOS-AppleSilicon, icon: assets/icon.icns, sep: ":" }
    defaults:
      run:
        shell: bash
    env:
      # Signature + notarisation Apple : actives seulement si les secrets sont configurés
      HAS_APPLE_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Télécharger FFmpeg (version statique, avec libx264)
        run: |
          set -euo pipefail
          mkdir -p ffbin
          case "${{ matrix.name }}" in
            Windows)
              FFURL=https://github.com/BtbN/FFmpeg-Builds/releases
              curl -fsSL -o ff.zip "$FFURL/download/latest/ffmpeg-master-latest-win64-gpl.zip"
              unzip -q -j ff.zip '*/bin/ffmpeg.exe' -d ffbin ;;
            Linux)
              FFURL=https://github.com/BtbN/FFmpeg-Builds/releases
              curl -fsSL -o ff.tar.xz "$FFURL/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
              tar -xJf ff.tar.xz --wildcards --strip-components=2 -C ffbin '*/bin/ffmpeg' ;;
            macOS-Intel)
              FFURL=https://ffmpeg.martin-riedl.de/
              curl -fsSL -o ff.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
              unzip -q -j ff.zip -d ffbin ;;
            macOS-AppleSilicon)
              FFURL=https://ffmpeg.martin-riedl.de/
              curl -fsSL -o ff.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
              unzip -q -j ff.zip -d ffbin ;;
          esac
          if [ "$RUNNER_OS" = "Windows" ]; then FF=ffbin/ffmpeg.exe; else FF=ffbin/ffmpeg; fi
          [ -f "$FF" ] || { echo "FFmpeg introuvable après le téléchargement"; ls -la ffbin; exit 1; }
          chmod +x "$FF"
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --force -s - "$FF"; fi
          "$FF" -hide_banner -version | head -1
          "$FF" -hide_banner -encoders | grep -q libx264 || { echo "Ce FFmpeg n'a pas libx264"; exit 1; }
          echo "FF=$FF" >> "$GITHUB_ENV"
          echo "FFURL=$FFURL" >> "$GITHUB_ENV"

      - name: Importer le certificat Apple (Developer ID)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signature.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificat.p12"
          security import "$RUNNER_TEMP/certificat.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificat.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "Aucun certificat « Developer ID Application » dans MACOS_CERTIFICATE"; exit 1; }
          echo "Signature avec : $IDENTITY"
          echo "MACOS_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Construire Onde2Vid
        run: |
          set -euo pipefail
          ICON=()
          if [ -n "${{ matrix.icon }}" ]; then ICON=(--icon "${{ matrix.icon }}"); fi
          if [ -n "${MACOS_IDENTITY:-}" ]; then
            ICON+=(--codesign-identity "$MACOS_IDENTITY" --osx-entitlements-file assets/entitlements.plist)
          fi
          pyinstaller --noconfirm --clean --windowed --name Onde2Vid "${ICON[@]}" \
            --add-binary "$FF${{ matrix.sep }}." \
            --add-data "assets/icon.png${{ matrix.sep }}assets" \
            --osx-bundle-identifier io.github.ulrikadam.onde2vid \
            Onde2Vid.py

      - name: Finaliser l'application Mac
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0"
          PLIST=dist/Onde2Vid.app/Contents/Info.plist
          plutil -replace LSUIElement -bool true "$PLIST"
          plutil -replace CFBundleDisplayName -string Onde2Vid "$PLIST"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          APP=dist/Onde2Vid.app
          if [ -n "${MACOS_IDENTITY:-}" ]; then      # signature Developer ID (de l'intérieur vers l'extérieur)
            codesign --force --options runtime --timestamp -s "$MACOS_IDENTITY" "$APP/Contents/Frameworks/ffmpeg"
            codesign --force --options runtime --timestamp --entitlements assets/entitlements.plist \
              -s "$MACOS_IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          else                                       # sans certificat : signature « ad hoc »
            codesign --force --deep -s - "$APP"
          fi

      - name: Notariser auprès d'Apple
        if: runner.os == 'macOS' && env.MACOS_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          ditto -c -k --keepParent dist/Onde2Vid.app notarisation.zip
          xcrun notarytool submit notarisation.zip "${AUTH[@]}" --wait --timeout 30m \
            --output-format json > notarisation.json || true
          cat notarisation.json; echo
          STATUS=$(python -c "import json; print(json.load(open('notarisation.json')).get('status', ''))" || true)
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(python -c "import json; print(json.load(open('notarisation.json')).get('id', ''))" || true)
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" "${AUTH[@]}"; fi
            echo "La notarisation a échoué (statut : ${STATUS:-inconnu})"; exit 1
          fi
          xcrun stapler staple dist/Onde2Vid.app
          spctl -a -vv dist/Onde2Vid.app
          rm -f notarisation.zip notarisation.json

      - name: Emballer
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="test"
          mkdir -p pkg/Onde2Vid
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto dist/Onde2Vid.app pkg/Onde2Vid/Onde2Vid.app
          else
            cp -R dist/Onde2Vid/. pkg/Onde2Vid/
          fi
          cp LICENSE pkg/Onde2Vid/LICENSE.txt
          {
            echo "Onde2Vid inclut FFmpeg (https://ffmpeg.org), un logiciel libre sous licence GNU GPL."
            echo "Il est fourni sans modification, pour qu'Onde2Vid fonctionne sans rien installer."
            echo "Provenance de ce binaire : $FFURL"
            echo "Code source de FFmpeg : https://ffmpeg.org/download.html"
          } > pkg/Onde2Vid/FFmpeg-LISEZMOI.txt
          {
            echo "Onde2Vid - premier lancement"
            echo ""
            echo "Windows : double-cliquez sur Onde2Vid.exe. Si « Windows a protégé votre ordinateur »"
            echo "  s'affiche : « Informations complémentaires », puis « Exécuter quand même »."
            echo ""
            echo "macOS : double-cliquez sur Onde2Vid.app. Le Mac bloque la première ouverture :"
            echo "  cliquez sur « Terminé », puis Réglages Système > Confidentialité et sécurité,"
            echo "  message sur Onde2Vid > « Ouvrir quand même » (mot de passe), et relancez l'app."
            echo "  Ou dans le Terminal : xattr -dr com.apple.quarantine <chemin de Onde2Vid.app>"
            echo ""
            echo "Linux : lancez Onde2Vid (double-clic, ou ./Onde2Vid dans un terminal)."
            echo ""
            echo "L'interface s'ouvre dans votre navigateur. Vos fichiers sont rangés dans"
            echo "Documents/Onde2Vid (input/ et output/). Onde2Vid s'arrête tout seul quand son"
            echo "onglet est fermé (jamais pendant une conversion)."
          } > pkg/Onde2Vid/LISEZMOI.txt
          OUT="Onde2Vid-$VERSION-${{ matrix.name }}"
          cd pkg
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent Onde2Vid "../$OUT.zip" ;;
            Windows) python -m zipfile -c "../$OUT.zip" Onde2Vid ;;
            Linux)   tar -czf "../$OUT.tar.gz" Onde2Vid ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Onde2Vid-${{ matrix.name }}
          path: |
            Onde2Vid-*.zip
            Onde2Vid-*.tar.gz
          if-no-files-found: error

  release:
    name: Publier la version
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Créer la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Onde2Vid $GITHUB_REF_NAME" --generate-notes
